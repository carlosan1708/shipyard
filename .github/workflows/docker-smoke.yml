name: Docker smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise the real Docker engine
        run: npm run test:docker
      - name: Upload failed browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-smoke-diagnostics
          path: |
            .shipyard/playwright/docker-smoke/**/error-context.md
            .shipyard/playwright/docker-smoke/**/test-failed-*.png
            .shipyard/playwright/docker-smoke/**/trace.zip
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

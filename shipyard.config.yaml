# Shipyard configuration.
# Relative paths are resolved against this file's folder.

# Select the provider for runs that don't specify one.
defaultProvider: claude

# Optional Codex settings. Omit model and effort to use the Codex CLI defaults.
# codex:
#   model: your-codex-model
#   models: [your-other-codex-model]
#   effort: high
#   timeoutMsPerAttempt: 1200000

# Claude settings.
model: claude-opus-5-5
effort: high

# Models you can pick per run in the UI (or with --model). The default model above is always offered.
models: [claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5]

# subscription: agents use your Claude Code sign-in (Pro/Max) and count against its usage limits.
#               API key variables in your shell are ignored, so runs never switch to per-token billing.
# api-key:      agents use ANTHROPIC_API_KEY (or a cloud provider) and are billed per token.
auth: subscription

# Hard limits per agent invocation. The SDK stops the agent when either is hit.
# Budgets are the SDK's cost estimate at API prices; on a subscription they cap usage, not a bill.
maxBudgetUsdPerStage: 3
maxTurnsPerStage: 60

# Hard limit for a whole run (every stage and retry together). A run stops before going over it.
# The UI and --budget can set a different limit for one run.
maxBudgetUsdPerRun: 10

# How many times a stage may retry after its gate (test command) fails.
maxGateRetries: 2

# In `shipyard ui`, agents may also request these tools; each call waits for your approval.
askTools: [WebFetch, WebSearch]

targets:
  # Created by `npm run demo:init` (a git copy of examples/demo-shop).
  demo-shop:
    path: .shipyard/targets/demo-shop
    test: npm test
    e2e: npm run e2e
    # Optional Linux runner for this target's project commands.
    # checksDocker:
    #   image: node:22-bookworm-slim

  # Add your own repos here, e.g.:
  # my-api:
  #   path: ~/Documents/GitHub/my-api
  #   test: npm test
  #   e2e: npm run test:e2e
  #   checksDocker:
  #     image: node:22-bookworm-slim
  #     install: npm ci --ignore-scripts
